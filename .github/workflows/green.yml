name: Daily Green Graph

on:
  schedule:
    - cron: "0 0 * * *"  # Setiap hari jam 00:00 UTC
  workflow_dispatch:

jobs:
  green:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Auto commit
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(date '+%Y-%m-%d %H:%M:%S')" > last-commit.txt
          git add last-commit.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "🟢 Daily green: $(date '+%Y-%m-%d')"
          git push
